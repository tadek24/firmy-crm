name: Cloud checks
on:
  push:
    branches: [main, codex/vercel-cloud]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm run test:integrations
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: package-lock.json
